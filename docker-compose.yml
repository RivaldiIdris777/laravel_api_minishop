version: '3.9'

services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - laravel-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html    
    depends_on:
      - mysql
    networks:
      - laravel-network
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_minishop
      DB_USERNAME: laravel_user
      DB_PASSWORD: laravel_password
      CACHE_DRIVER: file
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel_minishop
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-network
    restart: unless-stopped

  queue:
  build:
    context: .
    dockerfile: Dockerfile
  command: sh -c "sleep 20 && php artisan queue:work --sleep=3 --tries=3"
  depends_on:
    - mysql
    - app
  networks:
    - laravel-network
  environment:
    APP_ENV: production
    APP_DEBUG: false
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: laravel_minishop
    DB_USERNAME: laravel_user
    DB_PASSWORD: laravel_password
    CACHE_DRIVER: file
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
  restart: unless-stopped

volumes:
  mysql-data:

networks:
  laravel-network:
    driver: bridge